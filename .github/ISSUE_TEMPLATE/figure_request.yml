name: Figure or feature request
description: Ask for a new example figure, a new part or helper in the kit, a new check, or a change to how the skill works.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Specimen draws anatomy as a classroom teaching model: organs and vessels on a stand, whole, cut open or seen through a membrane. It is not a chart library, a medical atlas or a 3D viewer.
  - type: dropdown
    id: request
    attributes:
      label: What are you asking for?
      options:
        - A new example figure
        - A new part or helper in the kit
        - A new check or script
        - A change to the skill's instructions
        - Something else
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: For a figure, name the organ or system and what it should teach, with its real numbers (sizes in mm, rates, which structures must show), the views or cuts you need, and what should move. For anything else, describe the change.
      placeholder: A pancreas with the duodenum around its head and the splenic vessels behind it, whole and cut to show the duct.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind of figure
      options:
        - SVG
        - SVG + WebGL
        - Not sure
        - Not about a figure
  - type: textarea
    id: why
    attributes:
      label: Why it is worth adding
      description: What it would teach, or what you could not do without it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues.
          required: true
        - label: I read the Limits section of the README.
          required: true
