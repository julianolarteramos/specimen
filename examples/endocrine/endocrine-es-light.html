quea, con cuatro paratiroides detrás; más abajo están el timo sobre el corazón, el páncreas en el asa del duodeno, los dos riñones con una suprarrenal abierta en cada uno y las gónadas en la pelvis. La aorta, la vena cava inferior, una carótida y una yugular, los vasos porta hipofisarios, los vasos suprarrenales y esplénicos, el vago y el nervio aferente que viene del oído los unen."><path class="iso-halo" d="M125.7 671.7c.2-4.7 .4-9.6 1.8-14 1.6-4.8 4.2-9.5 7.2-13.6 3.5-4.7 7.8-8.9 12.3-12.6 5.3-4.2 11.1-7.9 17.1-11.1 6.8-3.6 13.9-6.7 21.1-9.3 7.9-2.9 16-5.2 24.2-7.1 8.8-2 17.7-3.5 26.6-4.5 9.2-1.1 18.5-1.7 27.8-1.9 9.4-.2 18.8 .1 28.1 .9 9.1 .7 18.2 1.9 27.1 3.6 8.5 1.6 17 3.6 25.2 6.2 7.6 2.3 15.1 5.1 22.3 8.5 6.4 3 12.8 6.5 18.6 10.6 5.1 3.5 10 7.6 14.1 12.1 3.6 3.9 6.8 8.5 9.1 13.3 2 4.3 3.2 9.2 3.7 13.9 .8 7.9 .4 16 0 23.9 -.2 4.7-.4 9.6-1.8 14 -1.6 4.8-4.2 9.4-7.2 13.5 -3.5 4.7-7.7 9-12.3 12.7 -5.2 4.2-11.1 7.9-17.1 11.1 -6.8 3.6-13.9 6.7-21.1 9.3 -7.9 2.8-16 5.1-24.2 7 -8.8 2-17.7 3.6-26.6 4.6 -9.2 1.1-18.6 1.6-27.9 1.8 -9.3 .2-18.7-.1-28-.8 -9.1-.7-18.2-1.9-27.1-3.6 -8.5-1.6-17-3.6-25.2-6.2 -7.6-2.4-15.1-5.2-22.3-8.6 -6.4-3-12.8-6.5-18.6-10.5 -5.1-3.5-10-7.6-14.1-12.1 -3.6-3.9-6.8-8.5-9.1-13.3 -2-4.3-3.2-9.2-3.7-13.9 -.8-7.9-.4-16 0-23.9z"/><g class="iso-solid"><path class="iso-fill" d="M136.6 659.5c13.7-9.2 27.3-18.5 41.1-27.6 .5-.3 1.1-.5 1.7-.7c-14.4 10.5-29.3 20.5-43.2 31.4 -1.5 1.2-1.9 3.3-2.9 4.9c3-5.8 5.8-11.7 8.9-17.4 .8-1.5 1.9-2.9 2.9-4.2 1.5-1.9 3-3.8 4.7-5.5 1.8-1.9 3.7-3.7 5.7-5.3 2.4-2 4.9-3.9 7.5-5.6 4.1-2.6 8.4-5 12.8-7.3 3.2-1.7 6.6-3.1 10-4.5 2.8-1.1 5.6-2.2 8.4-3.1 3.8-1.3 7.6-2.5 11.5-3.5 4.5-1.2 9-2.4 13.5-3.2 7.1-1.3 14.2-2.5 21.4-3.3 7.9-.8 15.9-1.2 23.8-1.5 4.5-.2 8.9 0 13.4 .1 4.5 .2 8.9 .4 13.4 .8 3.9 .3 7.8 .8 11.7 1.3 4.7 .7 9.5 1.4 14.2 2.3 5 1 10 2.2 14.9 3.5 3.9 1 7.7 2.2 11.5 3.5 2.8 .9 5.6 2 8.4 3.1 3.4 1.4 6.8 2.8 10 4.5 4.6 2.4 9.2 5.1 13.6 7.9 2.3 1.5 4.6 3.2 6.7 5 2 1.7 3.9 3.4 5.7 5.3 1.7 1.7 3.2 3.6 4.7 5.5 1 1.3 2.1 2 impáticos; el nervio aferente lleva la alarma desde el oído</span></span><span class="iso-caption">Un modelo de aula del sistema endocrino en la mitad posterior de un torso cortado en el plano coronal. Reproduce la respuesta al estrés a partir de un solo modelo, en bucle: una alarma llega al encéfalo por el nervio aferente; en segundos, los nervios simpáticos activan la médula suprarrenal, la adrenalina pasa a la sangre y el corazón late más rápido; en minutos, la CRH del hipotálamo baja por los vasos porta hasta la hipófisis anterior, la ACTH llega por la sangre a la corteza suprarrenal y sube el cortisol, que a su vez frena al hipotálamo y a la hipófisis. La lectura da el tiempo del modelo y el paso en curso, y las barras bajo el pie dan los niveles normalizados (de 0 a 1) del modelo: la amenaza dura 40 minutos y el bucle recorre 3 horas en 30 segundos.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;

const THREAT = 40 * 60;
const END = 3 * 3600;
const BASAL = 0.12;
const TAU = { nerve: 0.4, adrenalineUp: 1.5, adrenalineDown: 90, crh: 20, acth: 150, cortisol: 600 };
const BRAKE = { crh: 0.9, acth: 0.7 };
const BRAKING = 4 * 60;
const DURATION = 30;
const REST_BPM = 66;
const PEAK_BPM = 118;

const threat = (t) => (t >= 0 && t < THREAT ? 1 : 0);

const toward = (x, goal, dt, tau) => x + (goal - x) * (1 - Math.exp(-dt / tau));

function step(s, t, dt) {
  const signal = threat(t);
  return {
    nerve: toward(s.nerve, signal, dt, TAU.nerve),
    adrenaline: toward(s.adrenaline, s.nerve, dt, s.nerve > s.adrenaline ? TAU.adrenalineUp : TAU.adrenalineDown),
    crh: toward(s.crh, Math.max(0, (BASAL + signal) * (1 - BRAKE.crh * s.cortisol)), dt, TAU.crh),
    acth: toward(s.acth, Math.max(0, s.crh * (1 - BRAKE.acth * s.cortisol)), dt, TAU.acth),
    cortisol: toward(s.cortisol, s.acth, dt, TAU.cortisol),
  };
}

function rest() {
  let s = { nerve: 0, adrenaline: 0, crh: BASAL, acth: BASAL, cortisol: BASAL };
  for (let i = 0; i < 40000; i++) s = step(s, -1, 1);
  return s;
}

function table(samples = 260) {
  const times = [0];
  for (let i = 0; i < samples; i++) times.push(0.05 * Math.pow(END / 0.05, i / (samples - 1)));
  const rows = [];
  let s = rest();
  let t = 0;
  for (const goal of times) {
    while (t < goal - 1e-9) {
      const dt = Math.min(goal - t, t < 30 ? 0.005 : t < 600 ? 0.1 : 1);
      s = step(s, t, dt);
      t += dt;
    }
    rows.push([goal, s.nerve, s.adrenaline, s.crh, s.acth, s.cortisol].map((v) => Math.round(v * 10000) / 10000));
  }
  return rows;
}

function modelTime(r) {
  if (r <= 0) return 0;
  if (r < 7) return (10 * r) / 7;
  if (r < 21) return 10 * Math.pow((45 * 60) / 10, (r - 7) / 14);
  if (r < DURATION) return 45 * 60 * Math.pow(END / (45 * 60), (r - 21) / 9);
  return END;
}

function read(rows, t) {
  if (t <= rows[0][0]) return rows[0];
  let lo = 0;
  let hi = rows.length - 1;
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    if (rows[mid][0] <= t) lo = mid;
    else hi = mid;
  }
  const a = rows[lo];
  const b = rows[hi];
  const u = Math.min(1, Math.max(0, (t - a[0]) / (b[0] - a[0] || 1)));
  return a.map((v, i) => v + (b[i] - v) * u);
}

function clockText(t) {
  if (t < 60) return `${t < 10 ? t.toFixed(1) : Math.round(t)} s`;
  const min = Math.floor(t / 60);
  if (min < 60) return `${min} min`;
  return `${Math.floor(min / 60)} h ${String(min % 60).padStart(2, "0")} min`;
}

function phaseOf(t, row) {
  const [, , , , acth, cortisol] = row;
  if (t < 0.6) return "perceive";
  if (t < 4) return "nerve";
  if (t < 25) return "adrenaline";

  if (t < THREAT) return "brake";
  if (cortisol > 0.2) return "falling";
  return "rest";
}

const bpmOf = (adrenaline) => REST_BPM + (PEAK_BPM - REST_BPM) * adrenaline;

const L = D.text;
const stage = document.querySelector(".en-stage");
const svgs = [...stage.querySelectorAll("svg[data-view]")];
const views = svgs.map((svg) => ({ svg, heart: svg.querySelector('[data-part="heart"]'), brake: svg.querySelector('[data-part="brake"]'), waves: svg.querySelector('[data-part="waves"]'), groups: [...svg.querySelectorAll("[data-g]")] }));
const dots = [...document.querySelectorAll(".en-dot")];
const readout = document.querySelector("[data-readout]");
const meters = [...document.querySelectorAll(".en-level")].map((el) => ({ bar: el.querySelector("b"), value: el.querySelector("output") }));
const still = matchMedia("(prefers-reduced-motion: reduce)");
const HOLD = 4;
const STILL_AT = 14;
const LIT = {
  perceive: ["alarm", "cns"],
  nerve: ["hypothalamus", "sympathetic", "adrenal-medulla", "heart"],
  adrenaline: ["sympathetic", "adrenal-medulla", "heart"],
  crh: ["hypothalamus", "pituitary-a"],
  acth: ["pituitary-a", "adrenal-cortex"],
  brake: ["hypothalamus", "pituitary-a", "adrenal-cortex"],
  falling: [],
  rest: [],
};
const CHANNELS = ["blood", "cns", "nerve", "aff", "neu", "vag", "crh", "acth", "cor", "adr"];
const NERVES = ["cns", "nerve", "aff", "neu", "vag"];

let r = 0;
let beat = 0;
let lit = "";
let visible = false;
let frame = 0;
let last = 0;
let drag = null;
const phase = Object.fromEntries(CHANNELS.map((ch) => [ch, 0]));
const clamp01 = (v) => Math.min(1, Math.max(0, v));
const level = (v, base = 0.1, span = 0.55) => clamp01((v - base) / span);
const number = (v) => v.toFixed(2).replace(".", L.decimal);
const say = (text) => { if (readout.textContent !== text) readout.textContent = text; };

function light(names) {
  const key = names.join(" ");
  if (key === lit) return;
  lit = key;
  for (const g of views[current].groups) {
    if (names.includes(g.dataset.g)) g.setAttribute("data-lit", "");
    else g.removeAttribute("data-lit");
  }
}

function show(index) {
  current = (index + views.length) % views.length;
  views.forEach((v, i) => {
    if (i === current) v.svg.setAttribute("data-on", ""); else v.svg.removeAttribute("data-on");
    v.svg.setAttribute("aria-hidden", i === current ? "false" : "true");
  });
  dots.forEach((dot, i) => (i === current ? dot.setAttribute("aria-current", "true") : dot.removeAttribute("aria-current")));
  lit = "?";
}

function draw(dt, now) {
  const play = still.matches ? STILL_AT : Math.min(r, DURATION);
  const t = modelTime(play);
  const row = read(D.rows, t);
  const [, nerve, adrenaline, crh, acth, cortisol] = row;
  const css = stage.style;
  const alarm = play > 0 && t < THREAT;
  const levels = { blood: 0.3, cns: nerve, nerve, aff: alarm ? 1 : 0, neu: 0, vag: 0, crh: level(crh), acth: level(acth), cor: level(cortisol, 0.1, 0.35), adr: adrenaline };
  for (const ch of CHANNELS) css.setProperty(`--lv-${ch}`, levels[ch].toFixed(3));
  const bpm = bpmOf(adrenaline);
  const moving = still.matches ? 0 : 1;
  for (const ch of CHANNELS) phase[ch] = (phase[ch] + (NERVES.includes(ch) ? 60 : 14 * (bpm / REST_BPM)) * moving * dt) % 9000;
  for (const ch of CHANNELS) css.setProperty(`--ph-${ch}`, phase[ch].toFixed(2));
  light(LIT[phaseOf(t, row)]);
  const v = views[current];
  beat = (beat + moving * dt * (bpm / 60)) % 1;
  const squeeze = moving ? Math.pow(Math.sin(Math.PI * beat), 6) : 0;
  const [hx, hy] = D.views[current].heart;
  v.heart.setAttribute("transform", squeeze ? `translate(${hx} ${hy}) scale(${(1 - 0.05 * squeeze).toFixed(4)}) translate(${-hx} ${-hy})` : "");
  v.brake.style.opacity = level(cortisol, 0.16, 0.24).toFixed(3);
  v.waves.style.opacity = (alarm ? (moving ? 0.55 + 0.45 * Math.sin(now / 160) : 1) : 0).toFixed(3);
  const step = phaseOf(t, row);
  say(`t ${clockText(t).replace(".", L.decimal)} · ${L.phases[step]}`);
  [nerve, adrenaline, crh, acth, cortisol].forEach((value, i) => {
    const text = number(value);
    if (meters[i].value.textContent !== text) {
      meters[i].value.textContent = text;
      meters[i].bar.style.width = `${(clamp01(value) * 100).toFixed(1)}%`;
    }
  });
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 20) : 1 / 60;
  last = now;
  r += dt;
  if (r > DURATION + HOLD) r = 0;
  draw(dt, now);
  frame = visible && !still.matches ? requestAnimationFrame(tick) : 0;
}
const run = () => {
  if (!frame && visible && !still.matches) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
};
const turn = (index) => { show(index); draw(0, performance.now()); };
document.querySelectorAll(".en-step").forEach((button) => button.addEventListener("click", () => turn(current + Number(button.dataset.step))));

stage.addEventListener("keydown", (event) => {
  const keys = { ArrowLeft: () => turn(current - 1), ArrowRight: () => turn(current + 1), Home: () => turn(D.first) };
  if (!keys[event.key]) return;
  event.preventDefault();
  keys[event.key]();
});
stage.addEventListener("pointerdown", (event) => { drag = { x: event.clientX, from: current }; });
stage.addEventListener("pointermove", (event) => {
  if (!drag) return;
  const steps = Math.trunc((event.clientX - drag.x) / 70);
  if (drag.from + steps !== current) turn(drag.from + steps);
});
addEventListener("pointerup", () => { drag = null; });
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "80px 0px" }).observe(stage);
still.addEventListener?.("change", () => { draw(0, performance.now()); run(); });
show(current);
